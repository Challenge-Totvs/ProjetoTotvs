spring.application.name=api

#Configuração para conexão com o banco de dados oracle
spring.datasource.url=jdbc:oracle:thin:@${DB_URL}:${DB_PORT}:${DB_SID}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

#Configuração para controlar Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

analise.service.url=${ANALISE_SERVICE_URL:http://localhost:8000}
analise.service.timeout-ms=${ANALISE_SERVICE_TIMEOUT_MS:120000}